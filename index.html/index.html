<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How Hairy Are Your Legs?</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #ffe4ec;
    padding: 20px;
  }

  h1 {
    color: #d63384;
  }

  .container {
    background: white;
    padding: 20px;
    border-radius: 15px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  input, button {
    padding: 10px;
    margin: 10px;
    font-size: 16px;
  }

  button {
    background: #d63384;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .leg {
    width: 120px;
    height: 250px;
    background: #f5c6a5;
    margin: 20px auto;
    border-radius: 60px;
    position: relative;
    overflow: hidden;
  }

  .hair {
    position: absolute;
    width: 2px;
    height: 10px;
    background: black;
  }

  .result {
    font-size: 18px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h1>?? How Hairy Are Your Legs?</h1>

<div class="container">
  <p>When did you last shave?</p>
  <input type="date" id="dateInput">
  <br>
  <button onclick="calculateHair()">Check Hair Level</button>

  <div class="leg" id="leg"></div>

  <div class="result" id="result"></div>
</div>

<script>
function calculateHair() {
  const input = document.getElementById("dateInput").value;
  const leg = document.getElementById("leg");
  const result = document.getElementById("result");

  // ? FIXED this broken if statement
  if (!input) {
    result.innerText = "Pick a date first!";
    return;
  }

  const lastShave = new Date(input);
  const today = new Date();
  const diffDays = Math.floor((today - lastShave) / (1000 * 60 * 60 * 24));

  leg.innerHTML = "";

  // ? NEW: smooth hair growth
  let hairCount = Math.min(diffDays * 8, 200);

  let messages = [];

  if (diffDays <= 1) {
    messages = [
      "? Smooth operator",
      "Legs: fresh out the spa",
      "Silky. Elite. Untouchable.",
      "You could be in a razor commercial",
      "10/10 would shave again"
    ];
  } 
  else if (diffDays <= 3) {
    messages = [
      "?? Slight stubble",
      "You’re entering crunchy territory",
      "Soft… but suspicious",
      "Give it a day and we’ve got problems",
      "You can still wear shorts. For now."
    ];
  } 
  else if (diffDays <= 7) {
    messages = [
      "?? Getting noticeable",
      "Shorts are a bold choice",
      "You’ve crossed into ‘hmm’",
      "This is no longer low maintenance",
      "We are no longer smooth, we are textured"
    ];
  } 
  else if (diffDays <= 14) {
    messages = [
      "?? It's a situation",
      "You could start braiding this",
      "We’ve entered survival mode lite",
      "That’s not stubble… that’s intent",
      "Wind resistance has increased"
    ];
  } 
  else {
    messages = [
      "?? Survival mode",
      "Nature is reclaiming territory",
      "You could lose a sock in there",
      "This is a wildlife habitat now",
      "Somewhere, a razor is crying",
      "You’re one step from knitting a sweater",
      "Congratulations, you’ve unlocked: Forest Level"
    ];
  }

  // pick random message
  const message = messages[Math.floor(Math.random() * messages.length)];

  // generate hair
  for (let i = 0; i < hairCount; i++) {
    const hair = document.createElement("div");
    hair.classList.add("hair");

    hair.style.top = Math.random() * 240 + "px";
    hair.style.left = Math.random() * 110 + "px";
    hair.style.transform = `rotate(${Math.random() * 180}deg)`;

    leg.appendChild(hair);
  }

  result.innerText = `${diffDays} days since shaving... ${message}`;
}
</script>

</body>
</html>
